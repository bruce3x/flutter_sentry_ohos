pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.2" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
    id "io.sentry.android.gradle" version "4.14.1" apply false
}

include ":app"

// Force isar_flutter_libs (if present) to use modern compile/target SDK
gradle.beforeProject { p ->
    if (p.name == "isar_flutter_libs") {
        p.plugins.withId("com.android.library") {
            def androidExt = p.extensions.findByName("android")
            if (androidExt != null) {
                try {
                    androidExt.compileSdkVersion 35
                    if (androidExt.defaultConfig != null) {
                        androidExt.defaultConfig.targetSdkVersion 35
                    }
                    // Disable resource verification as a last-resort workaround
                    p.tasks.matching { it.name == 'verifyReleaseResources' }.all { t ->
                        t.enabled = false
                    }
                } catch (ignored) {}
            }
        }
    }
}
