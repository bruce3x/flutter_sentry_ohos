allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Ensure all Android libraries build against a consistent, modern compileSdk/targetSdk
subprojects { p ->
    p.plugins.withId("com.android.library") {
        def androidExt = p.extensions.findByName("android")
        if (androidExt != null) {
            try {
                androidExt.compileSdkVersion 35
                if (androidExt.defaultConfig != null) {
                    androidExt.defaultConfig.targetSdkVersion 35
                }
            } catch (ignored) {}
        }
    }
    p.plugins.withId("com.android.application") {
        def androidExt = p.extensions.findByName("android")
        if (androidExt != null) {
            try {
                androidExt.compileSdkVersion 35
                if (androidExt.defaultConfig != null) {
                    androidExt.defaultConfig.targetSdkVersion 35
                }
            } catch (ignored) {}
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
